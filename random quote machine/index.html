<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Random Quote Machine</title>
    </head>
    <body>
        <div id="wrapper">
        <div id="quote-box">
            <div class="quote-text">
            <i class="fa fa-quote-left"> </i><span id="text"></span><i class="fa fa-quote-right">
            </div>
            <div class="quote-author">- <span id="author"></span></div>
            <div class="buttons">
            <a
                class="button"
                id="tweet-quote"
                title="Tweet this quote!"
                target="_top"
            >
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a
                class="button"
                id="threads-quote"
                title="Post this quote on threads!"
                target="_blank"
            >
                <i class="fa-brands fa-threads"></i>
            </a>
            <button class="button" id="new-quote">Next</button>
            </div>
        </div>
        <div class="footer">By <a href="https://codepen.io/Mohammad-Atef">Mohammad Atef</a></div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
